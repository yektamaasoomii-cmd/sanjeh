<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سنجه">
<title>سنجه</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--ink:#17233A;--muted:#5E6B80;--rule:#DDE3EA;
  --accent:#1F4E79;--on-accent:#FFFFFF;--soft:#E8EFF7;
  --l4:#2F7D4F;--l3:#2F74B5;--l2:#B07C12;--l1:#B4475A;
  --warn-bg:#FFF3D6;--warn-ink:#6A4800;--radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F151E;--surface:#18212D;--ink:#E7ECF3;--muted:#9AA8BB;--rule:#2A3647;
    --accent:#7DB0E3;--on-accent:#0D1622;--soft:#1F2C3D;
    --l4:#5BBE86;--l3:#6CA8E0;--l2:#E2B24E;--l1:#E57E90;
    --warn-bg:#3A2E10;--warn-ink:#F4D995;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
#app{min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 120px}
.muted{color:var(--muted);font-size:.88rem}
.sm{font-size:.8rem}

/* top bar */
.bar{position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--rule);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;color:var(--accent)}
.mark svg{width:38px;height:38px}
.bn{font-weight:900;font-size:1.2rem;letter-spacing:0;line-height:1.2;color:var(--accent)}
.bs{font-size:.8rem;color:var(--muted)}

/* bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
#nav[hidden]{display:none}
#nav button{flex:1;border:0;background:none;padding:8px 4px 10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600}
#nav svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--accent)}
#nav button[aria-current="page"] svg{background:var(--soft);border-radius:999px;padding:2px 14px;width:52px;box-sizing:content-box;height:24px}

/* day header */
.dayhead{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);border-radius:var(--radius);padding:14px 10px;margin-top:4px}
.dayhead.slim{background:var(--surface);color:var(--ink);border:1px solid var(--rule);padding:8px;margin:10px 0}
.nav-arrow{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:inherit;font-size:1.4rem;line-height:1}
.dayhead.slim .nav-arrow{background:var(--soft)}
.dh-mid{flex:1;text-align:center}
.dh-k{font-size:.78rem;opacity:.8}
.dh-d{font-weight:800;font-size:1.05rem}
.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:4px}
.dayhead .link{color:inherit}
.link.danger{color:var(--l1)}

h2.sec{font-size:.95rem;font-weight:800;margin:20px 2px 8px;color:var(--muted)}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:.88rem}
.note.warn{background:var(--warn-bg);color:var(--warn-ink);display:block}

/* subject list */
.slist{display:flex;flex-direction:column;gap:8px}
.srow{text-align:right;border:1px solid var(--rule);background:var(--surface);border-radius:14px;padding:12px 14px;width:100%}
.sr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sr-n{font-weight:800}
.sr-c{font-size:.82rem;color:var(--muted)}
.bar-t{height:6px;background:var(--soft);border-radius:6px;margin-top:8px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--l4);border-radius:6px}

/* record */
.rhead{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.back{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);font-size:1.4rem}
.rh-n{font-weight:900;font-size:1.15rem;line-height:1.3}
.rh-d{font-size:.82rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.rtools{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;gap:8px}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.stu{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 12px 6px;margin-bottom:8px}
.stu.done{box-shadow:inset -4px 0 0 var(--l4)}
.st-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.st-n{font-weight:800}
.crit{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--rule)}
.st-h + .crit{border-top:0}
.cl{flex:1;font-size:.86rem;color:var(--muted);line-height:1.4}
.lvs{display:flex;gap:6px}
.lv{width:42px;height:42px;border-radius:50%;border:2px solid var(--rule);background:transparent;font-weight:800;font-size:.82rem;color:var(--muted);transition:transform .08s}
.lv:active{transform:scale(.92)}
.lv[aria-pressed="true"]{color:#fff}
.lv[data-l="4"][aria-pressed="true"]{background:var(--l4);border-color:var(--l4)}
.lv[data-l="3"][aria-pressed="true"]{background:var(--l3);border-color:var(--l3)}
.lv[data-l="2"][aria-pressed="true"]{background:var(--l2);border-color:var(--l2)}
.lv[data-l="1"][aria-pressed="true"]{background:var(--l1);border-color:var(--l1)}
@media (prefers-color-scheme:dark){.lv[aria-pressed="true"]{color:#0D1622}}

/* generic */
.empty{background:var(--surface);border:1.5px dashed var(--rule);border-radius:var(--radius);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:11px 18px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--l1);color:#fff}
.btn.sm{padding:7px 12px;font-size:.82rem;white-space:nowrap}
.btn.big{padding:14px 40px;font-size:1.05rem;border-radius:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px;margin-top:12px}
.ct{font-size:1rem;font-weight:800;margin:0 0 6px}
.ct-row{display:flex;justify-content:space-between;align-items:center}
.lockb{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 10px}
label.f{display:block;font-size:.84rem;color:var(--muted);margin:10px 0 4px}
input[type=text],textarea,.sel{width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:12px;padding:11px 12px}
textarea{min-height:110px;resize:vertical;line-height:1.7}
textarea.short{min-height:84px}
textarea.tall{min-height:220px}
.sel{margin-top:2px}
.names{list-style:persian;margin:6px 0 12px;padding-inline-start:26px;columns:2;column-gap:18px}
.names li{padding:2px 0;break-inside:avoid}
.sedit{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.si{width:24px;text-align:center;font-size:.8rem;color:var(--muted)}
.sedit input{flex:1}
.sedit button{border:1px solid var(--rule);background:var(--soft);border-radius:10px;min-width:42px;height:44px}
.subj-ed{margin-top:10px}
.se-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.92rem;margin-bottom:4px}
.seg{display:flex;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:4px;margin-top:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--rule);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--surface)}
th,td{border-bottom:1px solid var(--rule);padding:8px 6px;text-align:center}
th{background:var(--soft);font-weight:700;font-size:.78rem;line-height:1.35}
td.n,th.n{text-align:right;white-space:nowrap;padding-inline-start:10px}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;min-width:32px;padding:1px 6px;border-radius:8px;color:#fff;font-weight:800;font-size:.78rem}
.tag.l4{background:var(--l4)}.tag.l3{background:var(--l3)}.tag.l2{background:var(--l2)}.tag.l1{background:var(--l1)}
@media (prefers-color-scheme:dark){.tag{color:#0D1622}}
.nil{color:var(--rule)}
.dayt{font-weight:800;margin:16px 2px 6px}
.subt{font-weight:700;color:var(--accent);margin:4px 2px;font-size:.88rem}
.about{text-align:center;padding:22px 14px}
.ab-logo{width:64px;height:64px;margin:0 auto 6px;color:var(--accent)}
.ab-logo svg{width:64px;height:64px}
.ab-n{font-weight:900;font-size:1.4rem;color:var(--accent)}
.ab-c{font-weight:700;margin:10px 0 2px}
.credit{text-align:center;font-size:.75rem;color:var(--muted);margin-top:26px}

/* onboarding */
.ob{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 40px;min-height:100vh}
.ob-welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ob-logo{width:96px;height:96px;color:var(--accent)}
.ob-logo svg{width:96px;height:96px}
.ob-title{font-size:2.6rem;font-weight:900;margin:8px 0 0;color:var(--accent);line-height:1.2}
.ob-lead{margin:2px 0 14px;font-weight:700}
.ob-text{color:var(--muted);max-width:34ch;margin:0 0 26px}
.ob-credit{margin-top:34px;font-size:.82rem;color:var(--muted)}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--rule)}
.steps i.on{background:var(--accent)}
.ob-h{font-size:1.35rem;font-weight:900;margin:0 0 4px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.grade{border:1.5px solid var(--rule);background:var(--surface);border-radius:16px;padding:16px 6px;display:flex;flex-direction:column;align-items:center}
.grade b{font-size:1.7rem;line-height:1.2}
.grade span{font-size:.85rem;color:var(--muted)}
.grade[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.grade[aria-pressed="true"] span{color:inherit}
.ob-nav{display:flex;gap:8px;margin-top:24px}
.ob-nav .btn:first-child{flex:1;justify-content:center}

/* splash */
.splash{position:fixed;inset:0;z-index:20;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s}
.splash.out{opacity:0;pointer-events:none}
.sp-in{text-align:center}
.sp-logo{width:92px;height:92px;margin:0 auto;color:var(--on-accent)}
.sp-logo svg{width:92px;height:92px}
.sp-name{font-size:2.6rem;font-weight:900;margin-top:6px;line-height:1.2}
.sp-sub{opacity:.85}
.sp-credit{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:.82rem;opacity:.85}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.88rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.printhead,.printfoot{display:none}
@media (prefers-reduced-motion:reduce){.splash,.toast,.lv{transition:none}}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#333;--rule:#999;--soft:#eee}
  .bar,#nav,.noprint,.note,.credit,.splash,.toast{display:none!important}
  .wrap{padding:0;max-width:none}
  .printhead{display:block;margin-bottom:12px;border-bottom:1.5px solid #000;padding-bottom:6px;font-size:10pt}
  .ph-t{font-weight:900;font-size:13pt}
  .printfoot{display:block;margin-top:16px;font-size:9pt;text-align:center;border-top:1px solid #999;padding-top:6px}
  .tag{color:#000!important;background:none!important;border:1px solid #000}
  .tw{border:1px solid #999;overflow:visible}
  table{font-size:9.5pt}
  th,td{border:1px solid #999}
}
</style>
</head>
