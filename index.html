<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سنجه">
<title>سنجه</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#F1F3F7;--surface:#FFFFFF;--ink:#17233A;--muted:#5E6B80;--rule:#DEE4EC;
  --accent:#1F4E79;--on-accent:#FFFFFF;--soft:#E8EFF7;
  --l4:#2F7D4F;--l3:#2F74B5;--l2:#B07C12;--l1:#B4475A;
  --warn-bg:#FFF3D6;--warn-ink:#6A4800;--radius:18px;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --shadow:0 1px 2px rgba(23,35,58,.06),0 4px 14px rgba(23,35,58,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F151E;--surface:#18212D;--ink:#E7ECF3;--muted:#9AA8BB;--rule:#2A3647;
    --accent:#7DB0E3;--on-accent:#0D1622;--soft:#1F2C3D;
    --l4:#5BBE86;--l3:#6CA8E0;--l2:#E2B24E;--l1:#E57E90;
    --warn-bg:#3A2E10;--warn-ink:#F4D995;--shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
#app{min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 120px}
.muted{color:var(--muted);font-size:.88rem}
.sm{font-size:.8rem}

/* page transitions */
.page.in-fwd{animation:inFwd .34s var(--ease) both}
.page.in-back{animation:inBack .34s var(--ease) both}
.page.in-tab{animation:inTab .3s var(--ease) both}
.page.in-fade{animation:inFade .22s ease both}
@keyframes inFwd{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inTab{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
.page.in-fwd .srow,.page.in-tab .srow,.page.in-back .srow,.page.in-fwd .stu,.page.in-fade .stu{animation:rise .42s var(--ease) both;animation-delay:calc(var(--d,0)*35ms + 60ms)}
.stu.static{animation:none!important}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* top bar */
.bar{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;color:var(--accent)}
.mark svg{width:38px;height:38px}
.bn{font-weight:900;font-size:1.2rem;line-height:1.2;color:var(--accent)}
.bs{font-size:.8rem;color:var(--muted)}

/* bottom nav with sliding pill */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);--i:0}
#nav[hidden]{display:none}
#nav button{flex:1;border:0;background:none;padding:8px 4px 10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;position:relative;z-index:1;transition:color .25s}
#nav svg{width:24px;height:24px;transition:transform .3s var(--spring)}
#nav button[aria-current="page"]{color:var(--accent)}
#nav button[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
.nav-pill{position:absolute;top:7px;width:64px;height:30px;border-radius:999px;background:var(--soft);right:calc((100% / 3) * var(--i) + (100% / 6) - 32px);transition:right .38s var(--spring)}

/* day header */
.dayhead{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);border-radius:var(--radius);padding:14px 10px;margin-top:4px;position:relative;overflow:hidden}
.dayhead::after{content:"";position:absolute;inset:auto -30px -60px auto;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.dayhead.slim{background:var(--surface);color:var(--ink);border:1px solid var(--rule);padding:8px;margin:10px 0}
.dayhead.slim::after{display:none}
.nav-arrow{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:inherit;font-size:1.4rem;line-height:1;transition:transform .15s}
.nav-arrow:active{transform:scale(.9)}
.dayhead.slim .nav-arrow{background:var(--soft)}
.dh-mid{flex:1;text-align:center}
.dh-k{font-size:.78rem;opacity:.8}
.dh-d{font-weight:800;font-size:1.05rem}
.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:4px}
.dayhead .link{color:inherit}
.link.danger{color:var(--l1)}

h2.sec{font-size:.95rem;font-weight:800;margin:20px 2px 8px;color:var(--muted)}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:.88rem}
.note.warn{background:var(--warn-bg);color:var(--warn-ink);display:block}

/* subject list */
.slist{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:12px;text-align:right;border:1px solid var(--rule);background:var(--surface);border-radius:var(--radius);padding:12px 14px;width:100%;box-shadow:var(--shadow);transition:transform .15s var(--ease)}
.srow:active{transform:scale(.98)}
.sbadge{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:1.25rem;color:var(--h);background:color-mix(in srgb,var(--h) 14%,transparent)}
.sbadge.sm{width:34px;height:34px;border-radius:11px;font-size:1rem}
.sr-mid{flex:1;display:flex;flex-direction:column;min-width:0}
.sr-n{font-weight:800;font-size:1.02rem}
.sr-c{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 8px}
.sr-k{opacity:.75}
.sr-ring{position:relative;width:46px;height:46px;flex:none}
.sr-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--muted)}
.ring{width:46px;height:46px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.4}
.rg-b{stroke:var(--soft)}
.rg-f{stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .9s var(--ease) .15s}

/* record */
.rhead{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.back{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--surface);font-size:1.4rem;transition:transform .15s}
.back:active{transform:scale(.9)}
.rh-n{font-weight:900;font-size:1.2rem;line-height:1.3}
.rh-d{font-size:.82rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:600;color:var(--muted);transition:background .25s,color .25s,border-color .25s}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ck-i{font-style:normal;font-weight:900;margin-inline-end:4px;color:var(--l4)}
.chip[aria-pressed="true"] .ck-i{color:inherit}
.legend{display:flex;flex-direction:column;gap:2px;font-size:.76rem;color:var(--muted);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.rtools{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;gap:8px}
.rt-r{display:flex;align-items:center;gap:10px}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;position:relative}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw-t{width:36px;height:22px;border-radius:999px;background:var(--rule);position:relative;transition:background .25s}
.sw-t::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.sw input:checked + .sw-t{background:var(--accent)}
.sw input:checked + .sw-t::after{transform:translateX(-14px)}
.sw input:focus-visible + .sw-t{outline:3px solid var(--accent);outline-offset:2px}
.stu{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:10px 12px 6px;margin-bottom:8px;box-shadow:var(--shadow);transition:border-color .3s}
.stu.one{padding:8px 10px}
.stu.done{border-color:color-mix(in srgb,var(--l4) 45%,var(--rule))}
.st-h{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.stu.one .st-h{margin:0}
.st-n{font-weight:800;flex:1;min-width:0}
.av{position:relative;flex:none;width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--muted);font-size:.95rem;overflow:hidden}
.av-ok{position:absolute;inset:0;display:grid;place-items:center;background:var(--l4);color:#fff;transform:scale(0);border-radius:50%;transition:transform .35s var(--spring)}
.av-ok svg{width:18px;height:18px}
.stu.done .av-ok{transform:scale(1)}
.stu.static.done:not(.just-done) .av-ok{transition:none}
.stu.just-done{animation:glow .7s ease}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--l4) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.crit{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--rule)}
.st-h + .crit{border-top:0}
.cl{flex:1;font-size:.86rem;color:var(--muted);line-height:1.4}
.lvs{display:flex;background:var(--soft);border-radius:14px;padding:3px;gap:2px}
.lv{width:40px;height:38px;border-radius:11px;border:0;background:transparent;font-weight:800;font-size:1.02rem;color:var(--muted);transition:background .2s,color .2s,transform .1s}
.lv:active,.cb:active{transform:scale(.88)}
.lv[aria-pressed="true"]{color:#fff}
.lv[data-l="4"][aria-pressed="true"]{background:var(--l4)}
.lv[data-l="3"][aria-pressed="true"]{background:var(--l3)}
.lv[data-l="2"][aria-pressed="true"]{background:var(--l2)}
.lv[data-l="1"][aria-pressed="true"]{background:var(--l1)}
.ck{display:flex;gap:6px}
.cb{width:52px;height:38px;border-radius:12px;border:1.5px solid var(--rule);background:transparent;color:var(--muted);display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s,transform .1s}
.cb svg{width:20px;height:20px}
.cb.yes[aria-pressed="true"]{background:var(--l4);border-color:var(--l4);color:#fff}
.cb.no[aria-pressed="true"]{background:var(--l1);border-color:var(--l1);color:#fff}
@media (prefers-color-scheme:dark){.lv[aria-pressed="true"],.cb[aria-pressed="true"]{color:#0D1622!important}}
.pop{animation:pop .38s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* generic */
.empty{background:var(--surface);border:1.5px dashed var(--rule);border-radius:var(--radius);padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:14px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:11px 18px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,filter .2s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--l1);color:#fff}
.btn.sm{padding:7px 12px;font-size:.82rem;white-space:nowrap}
.btn.big{padding:14px 44px;font-size:1.05rem;border-radius:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.ct{font-size:1rem;font-weight:800;margin:0 0 6px}
.ct-row{display:flex;justify-content:space-between;align-items:center}
.lockb{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 10px}
label.f{display:block;font-size:.84rem;color:var(--muted);margin:10px 0 4px}
input[type=text],textarea,.sel{width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:12px;padding:11px 12px;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
textarea.tall{min-height:220px}
.sel{margin-top:2px}
.names{list-style:persian;margin:6px 0 12px;padding-inline-start:26px;columns:2;column-gap:18px}
.names li{padding:2px 0;break-inside:avoid}
.sedit{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.si{width:24px;text-align:center;font-size:.8rem;color:var(--muted)}
.sedit input{flex:1}
.sedit button,.cdel{border:1px solid var(--rule);background:var(--soft);border-radius:10px;min-width:40px;height:42px}
.subj-ed{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.se-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.se-name{flex:1;font-weight:800;background:transparent!important;border-color:transparent!important;padding:6px 8px!important}
.se-name:focus{border-color:var(--accent)!important}
.cedit{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cedit input{flex:1;min-width:0;padding:9px 10px!important;font-size:.9rem}
.tsw{display:flex;background:var(--soft);border-radius:10px;padding:3px;flex:none}
.tsw button{border:0;background:none;border-radius:8px;padding:6px 8px;font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.tsw button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:4px;margin-top:4px}
.seg-pill{position:absolute;top:4px;bottom:4px;width:calc((100% - 8px) / var(--n));right:calc(4px + (100% - 8px) / var(--n) * var(--i));background:var(--accent);border-radius:10px;transition:right .38s var(--spring)}
.seg button{position:relative;border:0;background:none;border-radius:10px;padding:8px 4px;font-weight:700;color:var(--muted);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--on-accent)}
.tw{overflow-x:auto;border-radius:12px;border:1px solid var(--rule);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--surface)}
th,td{border-bottom:1px solid var(--rule);padding:8px 6px;text-align:center}
th{background:var(--soft);font-weight:700;font-size:.78rem;line-height:1.35}
td.n,th.n{text-align:right;white-space:nowrap;padding-inline-start:10px}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;min-width:28px;padding:1px 6px;border-radius:8px;color:#fff;font-weight:800;font-size:.85rem}
.tag.l4{background:var(--l4)}.tag.l3{background:var(--l3)}.tag.l2{background:var(--l2)}.tag.l1{background:var(--l1)}
@media (prefers-color-scheme:dark){.tag{color:#0D1622}}
.frac{display:block;font-size:.72rem;font-weight:700;color:var(--l2);white-space:nowrap;margin-top:2px}
.frac.full{color:var(--l4)}.frac.zero{color:var(--l1)}
.yn{font-weight:900;font-size:1rem}
.yn.y{color:var(--l4)}.yn.n{color:var(--l1)}
.nil{color:var(--rule)}
.dayt{font-weight:800;margin:16px 2px 6px}
.subt{font-weight:800;color:var(--h,var(--accent));margin:4px 2px;font-size:.88rem}
.about{text-align:center;padding:22px 14px}
.ab-logo{width:64px;height:64px;margin:0 auto 6px;color:var(--accent)}
.ab-logo svg{width:64px;height:64px}
.ab-n{font-weight:900;font-size:1.4rem;color:var(--accent)}
.ab-c{font-weight:700;margin:10px 0 2px}
.credit{text-align:center;font-size:.75rem;color:var(--muted);margin-top:26px}

/* onboarding */
.ob{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 40px;min-height:100vh}
.ob-welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ob-welcome > *{animation:rise .6s var(--ease) both}
.ob-welcome > :nth-child(2){animation-delay:.08s}.ob-welcome > :nth-child(3){animation-delay:.14s}.ob-welcome > :nth-child(4){animation-delay:.2s}.ob-welcome > :nth-child(5){animation-delay:.28s}.ob-welcome > :nth-child(n+6){animation-delay:.34s}
.ob-logo{width:96px;height:96px;color:var(--accent)}
.ob-logo svg{width:96px;height:96px}
.ob-title{font-size:2.6rem;font-weight:900;margin:8px 0 0;color:var(--accent);line-height:1.2}
.ob-lead{margin:2px 0 14px;font-weight:700}
.ob-text{color:var(--muted);max-width:34ch;margin:0 0 26px}
.ob-credit{margin-top:34px;font-size:.82rem;color:var(--muted)}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--rule);position:relative;overflow:hidden}
.steps i.on::after{content:"";position:absolute;inset:0;background:var(--accent);animation:fill .5s var(--ease) both;transform-origin:right}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ob-h{font-size:1.35rem;font-weight:900;margin:0 0 4px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.grade{border:1.5px solid var(--rule);background:var(--surface);border-radius:16px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;transition:background .25s,color .25s,border-color .25s,transform .15s}
.grade:active{transform:scale(.94)}
.grade b{font-size:1.7rem;line-height:1.2}
.grade span{font-size:.85rem;color:var(--muted)}
.grade[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.grade[aria-pressed="true"] span{color:inherit}
.ob-nav{display:flex;gap:8px;margin-top:24px}
.ob-nav .btn:first-child{flex:1;justify-content:center}

/* splash */
.splash{position:fixed;inset:0;z-index:20;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,transform .6s var(--ease)}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-in{text-align:center}
.sp-logo{width:96px;height:96px;margin:0 auto;color:var(--on-accent)}
.sp-logo svg{width:96px;height:96px;overflow:visible}
.sp-logo .lg-d{animation:drop .5s var(--spring) both;transform-box:fill-box;transform-origin:center}
.sp-logo .lg-d:nth-of-type(1){animation-delay:.05s}.sp-logo .lg-d:nth-of-type(2){animation-delay:.15s}.sp-logo .lg-d:nth-of-type(3){animation-delay:.25s}.sp-logo .lg-d:nth-of-type(4){animation-delay:.35s}
.sp-logo .lg-r{animation:grow .45s var(--ease) both;transform-box:fill-box;transform-origin:right}
.sp-logo .lg-r:nth-of-type(1){animation-delay:.2s}.sp-logo .lg-r:nth-of-type(2){animation-delay:.3s}.sp-logo .lg-r:nth-of-type(3){animation-delay:.4s}.sp-logo .lg-r:nth-of-type(4){animation-delay:.5s}
@keyframes drop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sp-name{font-size:2.8rem;font-weight:900;margin-top:6px;line-height:1.2;animation:rise .6s var(--ease) .45s both}
.sp-sub{opacity:.85;animation:rise .6s var(--ease) .55s both}
.sp-credit{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:.82rem;opacity:.85;animation:inFade .6s ease .7s both}

.toast{position:fixed;bottom:84px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.88rem;z-index:30;opacity:0;transition:opacity .25s,transform .35s var(--spring);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.printhead,.printfoot{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rg-f{stroke-dashoffset:var(--o,0)}}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#333;--rule:#999;--soft:#eee}
  .bar,#nav,.noprint,.note,.credit,.splash,.toast{display:none!important}
  .page{animation:none!important}
  .wrap{padding:0;max-width:none}
  .printhead{display:block;margin-bottom:12px;border-bottom:1.5px solid #000;padding-bottom:6px;font-size:10pt}
  .ph-t{font-weight:900;font-size:13pt}
  .printfoot{display:block;margin-top:16px;font-size:9pt;text-align:center;border-top:1px solid #999;padding-top:6px}
  .tag{color:#000!important;background:none!important;border:1px solid #000}
  .frac,.yn{color:#000!important}
  .tw{border:1px solid #999;overflow:visible}
  table{font-size:9.5pt}
  th,td{border:1px solid #999}
}
</style>
